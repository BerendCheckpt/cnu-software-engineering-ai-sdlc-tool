  # added: the .NET 10 breaking-change overview, the official target guide for a .NET 9 -> 10 migration
  - { id: dotnet-10-compat, framework: dotnet, version: "10", url: https://learn.microsoft.com/en-us/dotnet/core/compatibility/10 }
  # added: the official ASP.NET Core 9 -> 10 migration article (global.json, target framework, packages)
  - { id: aspnetcore-migrate-9-to-10, framework: aspnetcore, version: "10", url: https://learn.microsoft.com/en-us/aspnet/core/migration/90-to-100 }

  # .NET 9 (the other of the latest two versions)
