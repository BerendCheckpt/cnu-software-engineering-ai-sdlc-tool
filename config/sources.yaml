# Official documentation the agent may use. Nothing here is downloaded until a human approves it:
#   aisdlc docs request <id>   ->  aisdlc approve <approval-id>
# Downloaded pages are stored read-only under knowledge/docs/<framework>/<version>/<id>.md.
#
# Entries marked "added:" were not in the original list; they are needed as the official source or target
# documentation for a migration path in config/migrations.yaml. Review them.

allowedHosts:
  - learn.microsoft.com
  - angular.dev
  # added: archived docs of the Angular versions an app migrates from. angular.dev is always the latest version.
  - v20.angular.dev
  - v21.angular.dev
  - xunit.net
  - vitest.dev
  - www.typescriptlang.org
  - developer.mozilla.org

# Hosts a repository may be cloned from (https only, shallow, after approval).
repositoryHosts:
  - github.com
  - dev.azure.com

sources:
  # C# language, 12 to 15
  - { id: csharp-12, framework: csharp, version: "12", url: https://learn.microsoft.com/en-us/dotnet/csharp/whats-new/csharp-12 }
  - { id: csharp-13, framework: csharp, version: "13", url: https://learn.microsoft.com/en-us/dotnet/csharp/whats-new/csharp-13 }
  - { id: csharp-14, framework: csharp, version: "14", url: https://learn.microsoft.com/en-us/dotnet/csharp/whats-new/csharp-14 }
  - { id: csharp-15, framework: csharp, version: "15", url: https://learn.microsoft.com/en-us/dotnet/csharp/whats-new/csharp-15 }

  # .NET 10
  - { id: aspnetcore-10, framework: aspnetcore, version: "10", url: https://learn.microsoft.com/en-us/aspnet/core/release-notes/aspnetcore-10.0 }
