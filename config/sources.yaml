  - { id: dotnet-10-runtime, framework: dotnet, version: "10", url: https://learn.microsoft.com/en-us/dotnet/core/whats-new/dotnet-10/runtime }
  - { id: dotnet-10-libraries, framework: dotnet, version: "10", url: https://learn.microsoft.com/en-us/dotnet/core/whats-new/dotnet-10/libraries }
  # CHECK: this URL answered 404 on 2026-11-03. The page may have moved; replace the URL once the right one is known.
